      <path fill-rule="evenodd" clip-rule="evenodd" d="M190 850V174H438C682 174 846 310 846 512C846 714 682 850 438 850H190ZM370 344V680H438C574 680 666 616 666 512C666 408 574 344 438 344H370Z"/>
